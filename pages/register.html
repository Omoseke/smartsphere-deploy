<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - SmartSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="min-h-screen bg-gradient-to-r from-pink-100 via-white to-green-50">
  <!-- Header -->
  <div class="flex justify-between items-center px-10 py-4">
    <div>
      <span class="font-semibold text-[20px] leading-[35px] tracking-tight text-center" style="font-family: 'Outfit', sans-serif; color: rgba(117, 105, 187, 1);">SMARTSPHERE</span>
    </div>
    <select class="bg-gray-100 border border-gray-400 rounded-full px-4 py-1 text-sm">
      <option>English</option>
      <option>Arabic</option>
      <option>French</option>
      <option>Idioma Portugues</option>
    </select>
  </div>

  <div class="w-full px-6 md:px-10 flex flex-col md:flex-row">
    <!-- Left side -->
    <div class="hidden md:flex md:w-1/2 flex-col items-center justify-center p-10">
      <h2 class="text-2xl font-bold mb-2">Create an account</h2>
      <p class="text-sm text-gray-500 mb-6">Complete the form to get started</p>
      <img src="/assets/img/meditating.png" alt="Meditating Illustration" class="max-w-sm" />
      <p class="mt-6 text-lg text-center text-gray-700">Do you have an account? <a href="/pages/login.html" class="text-purple-600 font-semibold text-lg" style="color: rgba(117, 105, 187, 1);">Login here</a></p>
    </div>

    <!-- Registration Form -->
    <div class="w-full md:w-1/2 p-6 md:p-10">
      <p class="text-lg text-center text-gray-800 font-bold mb-6">Make your work easier and organized today</p>
      <form class="space-y-4">
        <input type="email" placeholder="Email" class="w-full border border-gray-300 rounded-full px-5 py-3 placeholder-gray-400" />
        <div class="flex space-x-4">
          <input type="text" placeholder="First name" class="w-1/2 border border-gray-300 rounded-full px-5 py-3 placeholder-gray-400" />
          <input type="text" placeholder="Last name" class="w-1/2 border border-gray-300 rounded-full px-5 py-3 placeholder-gray-400" />
        </div>
        <input type="text" placeholder="Other names" class="w-full border border-gray-300 rounded-full px-5 py-3 placeholder-gray-400" />
        <input type="password" placeholder="Create your password" class="w-full border border-gray-300 rounded-full px-5 py-3 placeholder-gray-400" />
        <input type="password" placeholder="Confirm your password" class="w-full border border-gray-300 rounded-full px-5 py-3 placeholder-gray-400" />

        <div class="flex items-center text-xs mt-2">
          <input type="checkbox" id="consent" class="mr-2">
          <label for="consent">By clicking Create Account you agree to our consent clause for <span class="text-red-600">Data Collection and Privacy Policy</span>.</label>
        </div>

        <button class="w-full mt-4 bg-purple-600 hover:bg-purple-700 text-white rounded-full py-3 font-semibold text-lg" style="background-color: rgba(117, 105, 187, 1);">Create account</button>
      </form>
    </div>
  </div>
</body>
</html>
