<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SmartSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="min-h-screen bg-gradient-to-r from-pink-50 to-white-50 flex flex-col md:flex-row items-center justify-center px-4 md:px-16 py-10">
  <!-- Left Section -->
  <div class="w-full md:w-1/2 space-y-6 md:pr-12">
    <h1 class="text-3xl font-bold text-[rgba(117,105,187,1)] text-center">Welcome back !!</h1>
    <p class="text-gray-600 text-center">simplify your workflow and increase your productivity with smartsphere</p>

    <form class="space-y-4">
      <input type="text" placeholder="Username" class="w-full border border-gray-300 rounded-full px-5 py-3 placeholder-gray-400" />
      <div class="relative">
        <input id="password" type="password" placeholder="Password" class="w-full border border-gray-300 rounded-full px-5 py-3 placeholder-gray-400" />
        <span id="toggle-icon" class="absolute right-5 top-1/2 transform -translate-y-1/2 cursor-pointer" onclick="togglePasswordVisibility()">
          <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5.25 12 5.25c4.478 0 8.268 2.693 9.542 6.75-1.274 4.057-5.064 6.75-9.542 6.75-4.477 0-8.268-2.693-9.542-6.75z" />
          </svg>
        </span>
      </div>
      <div class="text-right text-sm text-gray-500">
        <a href="#" class="hover:underline">Forgot Password?</a>
      </div>
      <button type="submit" class="w-full bg-[rgba(117,105,187,1)] hover:bg-[rgba(117,105,187,0.85)] text-white font-semibold rounded-full py-3 text-lg">Login</button>
    </form>

    <div class="flex items-center justify-center gap-4 my-4">
      <hr class="w-1/4 border-gray-300"> <span class="text-sm text-gray-400">Or continue with</span> <hr class="w-1/4 border-gray-300">
    </div>
    <div class="flex justify-center space-x-4">
      <img src="/assets/img/Google_Icons.webp" alt="Google" class="w-6 h-6 cursor-pointer">
      <img src="/assets/img/Facebook.png" alt="Facebook" class="w-6 h-6 cursor-pointer">
      <img src="/assets/img/Apple Logo.png" alt="Apple" class="w-6 h-6 cursor-pointer">
    </div>
    <p class="text-sm text-center text-gray-500 mt-6">Not a member? <a href="/pages/register.html" class="text-[rgba(117,105,187,1)] font-medium">Register now</a></p>
  </div>

  <!-- Right Section -->
  <div class="w-full md:w-1/2 flex flex-col items-center justify-center mt-10 md:mt-0">
    <div class="bg-blue-50 rounded-3xl p-8 relative w-full max-w-md min-h-full">
      <div class="relative w-full h-auto">
        <img src="/assets/img/Social media marketing and digital advertising.png" alt="Background Graphic" class="absolute top-0 left-0 w-full h-auto z-10" />
        <img src="/assets/img/meditating.png" alt="Meditating" class="relative z-20 w-full h-auto" />
      </div>
      <div class="absolute top-5 left-5 space-y-2">
      </div>
      <div class="bg-white rounded-xl p-5 w-48 shadow-md">
        <h3 class="font-bold text-sm">Item to be Shipped</h3>
        <p class="text-xs text-gray-500">30 Task</p>
        <div class="flex items-center justify-between mt-2">
          <span class="text-sm">Progress</span>
          <span class="text-xs font-bold text-[rgba(117,105,187,1)]">90%</span>
        </div>
      </div>
      <p class="mt-6 text-sm text-gray-700 font-semibold">Make your work easier and organized with <span class="text-[rgba(117,105,187,1)]">SMARTSPHERE</span></p>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.5 12c1.274 4.057 5.065 6.75 9.543 6.75 1.598 0 3.104-.37 4.446-1.03m2.742-2.052A10.45 10.45 0 0022.5 12c-1.274-4.057-5.065-6.75-9.543-6.75-1.206 0-2.364.214-3.432.606" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />`;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5.25 12 5.25c4.478 0 8.268 2.693 9.542 6.75-1.274 4.057-5.064 6.75-9.542 6.75-4.477 0-8.268-2.693-9.542-6.75z" />`;
      }
    }
  </script>
</body>
</html>
