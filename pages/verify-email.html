<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email - SmartSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="min-h-screen bg-gradient-to-r from-green-50 to-white flex flex-col justify-center items-center px-6 relative text-center">
  <!-- Header -->
  <div class="absolute top-4 left-6">
    <span class="font-semibold text-[20px] leading-[35px] tracking-tight text-center" style="font-family: 'Outfit', sans-serif; color: rgba(117, 105, 187, 1);">SMARTSPHERE</span>
  </div>

  <!-- Language Dropdown -->
  <div class="absolute top-4 right-6">
    <select class="bg-gray-100 border border-gray-400 rounded-full px-4 py-1 text-sm">
        <option>English</option>
        <option>Arabic</option>
        <option>French</option>
        <option>Idioma Portugues</option>
      </select>
  </div>

  <!-- Email Verification Notice -->
  <div class="flex flex-col items-center justify-center space-y-6 mt-10">
    <img src="/assets/img/EnvelopeOpen.png" alt="Envelope Icon" class="w-36 h-36" />
    <h1 class="text-2xl font-semibold">Verify Your Email</h1>
    <p class="max-w-fit text-sm text-gray-600">Thank you for registering! To complete the process, please check your email for a verification link.<br /><span class="whitespace-nowrap">Click on the link to confirm your email address.</span></p>
    <a href="/pages/login.html" class="mt-4 inline-block text-white font-medium rounded-full px-10 py-3 text-lg" style="background-color: rgba(117, 105, 187, 1);">Proceed to Login</a>
  </div>
</body>
</html>
