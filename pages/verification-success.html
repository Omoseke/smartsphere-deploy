<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verified - SmartSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
<style>
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
    animation: fadeIn 1s ease-out forwards;
  }
</style>
</head>
<body class="min-h-screen bg-gradient-to-r from-green-50 via-white to-pink-50 flex flex-col justify-center items-center px-6 relative">
  <!-- Header -->
  <div class="absolute top-4 left-6">
    <span class="font-semibold text-[20px] leading-[35px] tracking-tight text-center" style="font-family: 'Outfit', sans-serif; color: rgba(117, 105, 187, 1);">SMARTSPHERE</span>
  </div>

  <!-- Language Dropdown -->
  <div class="absolute top-4 right-6">
    <select class="bg-gray-100 border border-gray-400 rounded-full px-4 py-1 text-sm">
        <option>English</option>
        <option>Arabic</option>
        <option>French</option>
        <option>Idioma Portugues</option>
      </select>
  </div>

  <!-- Email Verification Success Content -->
  <div class="text-center mt-20 scale-110 animate-fade-in">
    <div class="mb-8">
      <!-- Envelope Icon -->
      <img src="/assets/img/EnvelopeOpen.png" alt="Envelope Icon" class="w-[149px] h-[149px] mx-auto">
    </div>

    <h2 class="text-2xl font-semibold mb-3">Verify Your Email</h2>
    <p class="text-green-600 text-base">Account confirmation successful<br><a href="#" class="underline">Click to sign in.</a></p>

    <a href="/pages/register.html" class="inline-block mt-8 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-full px-10 py-4 text-lg" style="background-color: rgba(117, 105, 187, 1);">Proceed to Login</a>
  </div>
</body>
</html>
