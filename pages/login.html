<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SmartSphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="min-h-screen bg-gradient-to-r from-pink-50 to-white flex flex-col justify-center items-center px-6 relative">
  <!-- Header -->
  <div class="absolute top-4 left-6">
    <span class="font-semibold text-[20px] leading-[35px] tracking-tight text-center" style="font-family: 'Outfit', sans-serif; color: rgba(117, 105, 187, 1);">SMARTSPHERE</span>
  </div>

  <!-- Language Dropdown -->
  <div class="absolute top-4 right-6">
    <select class="bg-gray-100 border border-gray-400 rounded-full px-4 py-1 text-sm">
        <option>English</option>
        <option>Arabic</option>
        <option>French</option>
        <option>Idioma Portugues</option>
      </select>
  </div>

  <!-- Login Card -->
  <div class="relative w-full max-w-md md:max-w-xl bg-gray-100 rounded-3xl shadow-md px-8 pt-32 pb-10 mt-20">
    <div class="flex flex-col items-center">
      <img src="/assets/img/meditating.png" alt="Meditating Illustration" class="w-56 absolute -top-24 left-1/2 transform -translate-x-1/2">
      <h2 class="text-2xl font-bold mb-1">Welcome Back !!</h2>
      <p class="text-sm text-gray-500 mb-6">Please Sign In To Your Account</p>
    </div>

    <form class="space-y-5">
      <input type="email" placeholder="Email" class="w-full border border-gray-300 rounded-full px-5 py-3 placeholder-gray-400" />
      <div class="relative">
        <input id="password" type="password" placeholder="Password" class="w-full border border-gray-300 rounded-full px-5 py-3 placeholder-gray-400" />
        <span id="toggle-icon" class="absolute right-5 top-1/2 transform -translate-y-1/2 cursor-pointer" onclick="togglePasswordVisibility()">
          <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5.25 12 5.25c4.478 0 8.268 2.693 9.542 6.75-1.274 4.057-5.064 6.75-9.542 6.75-4.477 0-8.268-2.693-9.542-6.75z" />
          </svg>
        </span>
      </div>
      <div class="text-right text-sm text-gray-500">
        <a href="#" class="hover:underline">Forgot Password?</a>
      </div>
      <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-full py-3 text-lg" style="background-color: rgba(117, 105, 187, 1);">Login</button>
    </form>

    <p class="text-sm text-center text-gray-500 mt-6">New User? <a href="/pages/register.html" class="text-purple-600 font-medium">create an account?</a></p>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.5 12c1.274 4.057 5.065 6.75 9.543 6.75 1.598 0 3.104-.37 4.446-1.03m2.742-2.052A10.45 10.45 0 0022.5 12c-1.274-4.057-5.065-6.75-9.543-6.75-1.206 0-2.364.214-3.432.606" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />`;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5.25 12 5.25c4.478 0 8.268 2.693 9.542 6.75-1.274 4.057-5.064 6.75-9.542 6.75-4.477 0-8.268-2.693-9.542-6.75z" />`;
      }
    }
  </script>
</body>
</html>
