<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar - SmartSphere</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #f5f5f5;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #6a4fd4; /* Purple shade */
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .nav-links li {
            margin: 0 15px;
        }
        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            transition: color 0.3s ease;
        }
        .nav-links a:hover {
            color: #6a4fd4; /* Purple shade */
        }
        .auth-buttons {
            display: flex;
        }
        .auth-buttons a {
            text-decoration: none;
            margin-left: 15px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .login {
            color: #6a4fd4;
            border: 1px solid #6a4fd4;
            background-color: transparent;
        }
        .login:hover {
            background-color: #6a4fd4;
            color: #fff;
        }
        .signup {
            color: #fff;
            background-color: #6a4fd4;
            border: none;
        }
        .signup:hover {
            background-color: #573cb7; /* Darker purple */
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">SmartSphere</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Service</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">About Us</a></li>
        </ul>
        <div class="auth-buttons">
            <a href="#" class="login">Log In</a>
            <a href="#" class="signup">Sign Up</a>
        </div>
    </nav>
</body>
</html>
