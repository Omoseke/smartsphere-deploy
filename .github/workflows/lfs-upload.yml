name: Upload Large Files with Git LFS

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch where large files are located'
        required: true
        default: 'main'

jobs:
  upload-lfs-files:
    name: Upload Large Files with Git LFS
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.source_branch }}
        lfs: true
    
    - name: Set up Git LFS
      run: |
        git lfs install
        
    - name: Configure Git LFS tracking
      run: |
        git lfs track "*.tar.gz"
        git lfs track "*.zip"
        git lfs track "*.png"
        git lfs track "package-lock.json"
        git add .gitattributes
        
    - name: Identify large files
      id: identify_files
      run: |
        # List potentially large files
        echo "Looking for large files to upload..."
        LARGE_FILES=$(find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "generated-icon.png" -o -name "package-lock.json" \) -not -path "*/node_modules/*" -not -path "*/.git/*")
        echo "Found files: $LARGE_FILES"
        
        # Verify if files exist
        for file in $LARGE_FILES; do
          if [ -f "$file" ]; then
            echo "File exists: $file ($(du -h $file | cut -f1))"
            echo "$file" >> large_files_list.txt
          fi
        done
        
        if [ -f "large_files_list.txt" ]; then
          echo "::set-output name=has_files::true"
        else
          echo "::set-output name=has_files::false"
        fi
    
    - name: Commit and push large files
      if: steps.identify_files.outputs.has_files == 'true'
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        while read file; do
          echo "Adding $file to Git LFS..."
          git add "$file"
        done < large_files_list.txt
        
        git commit -m "Add large files via Git LFS"
        
        # Force push to avoid merge conflicts with existing placeholders
        git push origin ${{ github.event.inputs.source_branch }} --force
        
        echo "Successfully pushed large files to GitHub with Git LFS"
      
    - name: No large files found
      if: steps.identify_files.outputs.has_files != 'true'
      run: |
        echo "No large files were found to upload."