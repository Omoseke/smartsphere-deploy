name: CD Pipeline

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  determine-environment:
    name: Determine Deployment Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    
    steps:
    - name: Set environment based on trigger
      id: set-env
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "environment=prod" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
          echo "environment=dev" >> $GITHUB_OUTPUT
        else
          echo "environment=dev" >> $GITHUB_OUTPUT
        fi
  
  terraform-plan:
    name: Terraform Plan
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.2.0
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -backend-config=environments/${{ needs.determine-environment.outputs.environment }}/backend.tfvars
      
    - name: Terraform workspace
      run: |
        cd terraform
        terraform workspace select ${{ needs.determine-environment.outputs.environment }} || terraform workspace new ${{ needs.determine-environment.outputs.environment }}
      
    - name: Terraform Plan
      run: |
        cd terraform
        terraform plan -var-file=environments/${{ needs.determine-environment.outputs.environment }}/terraform.tfvars -out=tfplan
        
    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v3
      with:
        name: terraform-plan
        path: terraform/tfplan
        retention-days: 1

  terraform-apply:
    name: Terraform Apply
    needs: [determine-environment, terraform-plan]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.2.0
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Download Terraform Plan
      uses: actions/download-artifact@v3
      with:
        name: terraform-plan
        path: terraform

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -backend-config=environments/${{ needs.determine-environment.outputs.environment }}/backend.tfvars
      
    - name: Terraform workspace
      run: |
        cd terraform
        terraform workspace select ${{ needs.determine-environment.outputs.environment }} || terraform workspace new ${{ needs.determine-environment.outputs.environment }}
      
    - name: Terraform Apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan

  verification:
    name: Deployment Verification
    needs: [determine-environment, terraform-apply]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup AWS CLI
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
      
    - name: Verify Deployment
      run: |
        chmod +x scripts/verify-deployment.sh
        ./scripts/verify-deployment.sh ${{ needs.determine-environment.outputs.environment }}
      
    - name: Generate Dashboard
      run: |
        chmod +x scripts/generate-dashboard.sh
        ./scripts/generate-dashboard.sh
      
    - name: Upload Dashboard
      uses: actions/upload-artifact@v3
      with:
        name: deployment-dashboard
        path: dashboard/*.html
        retention-days: 5

  notification:
    name: Send Deployment Notification
    needs: [determine-environment, verification]
    runs-on: ubuntu-latest
    
    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,action,eventName,workflow
        text: "Deployment to ${{ needs.determine-environment.outputs.environment }} completed successfully! :rocket:"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: success()
      
    - name: Send email notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.MAIL_SERVER }}
        server_port: ${{ secrets.MAIL_PORT }}
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "Deployment to ${{ needs.determine-environment.outputs.environment }} completed"
        body: |
          Deployment to ${{ needs.determine-environment.outputs.environment }} environment has been completed successfully.
          
          - Commit: ${{ github.sha }}
          - Triggered by: ${{ github.actor }}
          - Workflow: ${{ github.workflow }}
          
          View the deployment dashboard for details.
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: SmartSphere CI/CD
      if: success()