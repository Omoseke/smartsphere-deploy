name: Process Complete Archive

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: 'URL to the complete application archive (must be a direct download link)'
        required: true
        type: string
      branch:
        description: 'Branch to upload to'
        required: true
        default: 'main'
        type: string

jobs:
  process-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}
          lfs: true
          token: ${{ secrets.GH_PAT }}
      
      - name: Set up Git LFS
        run: |
          git lfs install
          
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
      - name: Download archive from URL
        run: |
          echo "Downloading complete application archive..."
          curl -L "${{ github.event.inputs.archive_url }}" -o complete_app.tar.gz
          echo "Download complete."
          
      - name: Create backup of existing .gitattributes
        run: |
          if [ -f .gitattributes ]; then
            cp .gitattributes .gitattributes.backup
          fi
      
      - name: Ensure proper Git LFS tracking
        run: |
          echo "Setting up Git LFS tracking..."
          cat > .gitattributes << 'EOF'
          *.tar.gz filter=lfs diff=lfs merge=lfs -text
          *.zip filter=lfs diff=lfs merge=lfs -text
          *.png filter=lfs diff=lfs merge=lfs -text
          *.jpg filter=lfs diff=lfs merge=lfs -text
          *.jpeg filter=lfs diff=lfs merge=lfs -text
          *.gif filter=lfs diff=lfs merge=lfs -text
          *.pdf filter=lfs diff=lfs merge=lfs -text
          *.psd filter=lfs diff=lfs merge=lfs -text
          *.tgz filter=lfs diff=lfs merge=lfs -text
          *.gz filter=lfs diff=lfs merge=lfs -text
          *.bin filter=lfs diff=lfs merge=lfs -text
          *.mp4 filter=lfs diff=lfs merge=lfs -text
          *.mp3 filter=lfs diff=lfs merge=lfs -text
          *.wav filter=lfs diff=lfs merge=lfs -text
          *.mov filter=lfs diff=lfs merge=lfs -text
          *.avi filter=lfs diff=lfs merge=lfs -text
          *.iso filter=lfs diff=lfs merge=lfs -text
          *.7z filter=lfs diff=lfs merge=lfs -text
          *.rar filter=lfs diff=lfs merge=lfs -text
          package-lock.json filter=lfs diff=lfs merge=lfs -text
          EOF
          
          git add .gitattributes
          git commit -m "Update Git LFS tracking for all binary and large files"
          git push origin ${{ github.event.inputs.branch }}
      
      - name: Extract archive
        run: |
          echo "Creating temporary directory..."
          mkdir -p temp_extract
          
          echo "Extracting archive..."
          tar -xzf complete_app.tar.gz -C temp_extract
          
          echo "Moving files to repository root..."
          # Copy all files excluding some special ones
          cd temp_extract
          find . -type f -not -path "*/\.git*" | while read file; do
            # Create directory structure if it doesn't exist
            mkdir -p "../$(dirname "$file")"
            # Copy the file
            cp "$file" "../$file"
          done
          cd ..
          
          echo "Cleaning up..."
          rm -rf temp_extract
          rm complete_app.tar.gz
      
      - name: Add and commit files
        run: |
          echo "Adding files to Git..."
          git add .
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            echo "Committing changes..."
            git commit -m "Add complete SmartSphere application"
            
            echo "Pushing to GitHub with Git LFS..."
            git push origin ${{ github.event.inputs.branch }}
          fi
      
      - name: Verify upload
        run: |
          echo "Verifying uploaded files..."
          git lfs ls-files
          
          echo "Process complete. The entire application has been uploaded to GitHub."
